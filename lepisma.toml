# lepisma settings for this repo. Every key is optional; defaults shown in
# README.md. Copy this file to the root of any repo that uses lepisma.

# Paths (globs, relative to the repo root) the hook never lints.
ignore = ["corpus/**", "CHANGELOG.md"]

# extensions = [".md", ".markdown"]

[server]
# port = 8737
# Skip quietly when the server takes longer than this.
# timeout_ms = 300

[rules.long-sentence]      # R1
# enabled = true
# max_words = 25
# strong_words = 35

[rules.noun-stack]         # R2
# min_nouns = 4
# strong_nouns = 5
# ignore_all_propn = true
# max_proper_nouns = 1     # more than this and the run is a name, not a stack

[rules.habit-word]         # R3
# words = [...]            # replaces the built-in list
# extra_words = ["paradigm", "game-changer"]
# suggestions = { paradigm = "model" }
# max_per_paragraph = 2
# ok_at_item_start = ["ensure"]   # fine as a list item's first word

[rules.nominalization]     # R4
# weak_verbs = ["be", "have", "do", "make", "provide", "perform", "give", "offer", ...]
# extra_stoplist = ["migration"]
# min_length = 7
# max_per_sentence = 4

[rules.late-verb]          # R5
# max_words_before = 14
# strong_words_before = 20

[rules.vague-this]         # R6
# words = ["this", "these"]

[rules.tidy-summary]       # R7
# openers = ["overall", "in summary", "this ensures", ...]

[rules.interruption-load]  # R8
# warn_at = 2              # dashes, parentheses, semicolons and colons in a sentence
# strong_at = 3
# label_words = 4          # a dash or colon after this few words marks a label
# min_paren_words = 3      # a shorter parenthesis is a gloss, not an aside

[rules.contrast-frame]     # R9
# min_count = 3            # fewer frames than this never warn
# max_per_1000 = 4.0       # frames per 1,000 words; strong at twice this
